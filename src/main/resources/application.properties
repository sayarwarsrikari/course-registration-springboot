spring.application.name=course-registration

# Same default port the FastAPI/uvicorn version used
server.port=8000

# The API contract uses snake_case JSON (learner_id, completed_courses, ...)
spring.jackson.property-naming-strategy=SNAKE_CASE

# Swagger UI at /docs, OpenAPI document at /openapi.json (mirrors FastAPI)
springdoc.swagger-ui.path=/docs
springdoc.api-docs.path=/openapi.json
